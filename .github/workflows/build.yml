name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }}, Qt ${{ matrix.qt_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_version: '5.15.2'
            qt_arch: gcc_64
            qt_modules: ''
          - os: macos-latest
            qt_version: '5.15.2'
            qt_arch: clang_64
            qt_modules: ''
          - os: windows-latest
            qt_version: '5.15.2'
            qt_arch: win64_msvc2019_64
            qt_modules: ''
          - os: ubuntu-latest
            qt_version: '6.8.3'
            qt_arch: linux_gcc_64
            qt_modules: qt5compat
          - os: macos-latest
            qt_version: '6.8.3'
            qt_arch: clang_64
            qt_modules: qt5compat
          - os: windows-latest
            qt_version: '6.8.3'
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: linux
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          install-deps: true
          cache: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Set up MSVC 2019
        if: runner.os == 'Windows' && startsWith(matrix.qt_version, '5.')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29

      - name: Set up MSVC 2022
        if: runner.os == 'Windows' && startsWith(matrix.qt_version, '6.')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build-ci
          cd build-ci
          qmake ../liteidex CONFIG+=release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build-ci
          cd build-ci
          qmake_args=(CONFIG+=release 'QMAKE_LIBS_OPENGL=-framework OpenGL')
          if [[ '${{ matrix.qt_version }}' == 6.* ]]; then
            qmake_args+=('QMAKE_CXXFLAGS+=-include arm_acle.h')
          fi
          qmake ../liteidex "${qmake_args[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist build-ci mkdir build-ci
          cd build-ci
          qmake ..\liteidex CONFIG+=release CONFIG-=precompile_header

      - name: Compile (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make -C build-ci -j2

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: nmake /f build-ci\Makefile
